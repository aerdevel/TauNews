<article class="article-card">
  <a class="card-image" href="{{ article.get_absolute_url }}">
    {% if article.image %}<img src="{{ article.image.url }}" alt="{{ article.title }}">
    {% else %}<div class="image-placeholder"><span>TAU</span><small>NEWS HUB</small></div>{% endif %}
  </a>
  <div class="card-content">
    <a class="category-tag" href="{% url 'news:category' article.category.slug %}">{{ article.category.name }}</a>
    <h3><a href="{{ article.get_absolute_url }}">{{ article.title }}</a></h3>
    <p>{{ article.excerpt|truncatechars:115 }}</p>
    <div class="card-meta"><span>{{ article.published_at|date:"d.m.Y" }}</span><span>{{ article.views }} просмотров</span></div>
  </div>
</article>
